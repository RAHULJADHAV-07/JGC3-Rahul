# The security headers, in one place. nginx.conf includes this at the server and
# again in every location that sets a header of its own: nginx drops the whole
# inherited set the moment a location says `add_header` once, which is how the
# page itself — the one response they matter on — went out without any of them.
#
# The escaping in lib/docs.js and the DOMPurify pass in lib/safeHtml.js are what
# should stop an injected script; the CSP is what stops one doing anything
# useful if it ever gets through — it cannot load code from anywhere else, and
# it cannot send what it steals anywhere else.
#
# On Vercel the equivalent lives in frontend/vercel.json — keep the two in step.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
# No framing at all: an invisible iframe over a page the user trusts is how
# a click lands on "delete user".
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS belongs at whatever terminates TLS. Uncomment when this container is
# the thing holding the certificate — sending it over plain HTTP does
# nothing, and sending it from behind a proxy that also sends it duplicates.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
